name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One tag, v<version>, releases both packages. The Python and Rust versions must match it.
jobs:
  # Build and test without the OIDC permission, so build tools never see a token that can publish.
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Check that the tag matches both package versions
        run: |
          python_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          rust_version=$(python -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"])')
          test "v$python_version" = "$GITHUB_REF_NAME"
          test "v$rust_version" = "$GITHUB_REF_NAME"
      # The tests import kvrail from the installed package, as in CI.
      - run: python -m pip install . build pytest
      - run: python -m pytest -q
      - run: python -m build
      - run: cargo test --locked
        working-directory: rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A rerun after a partial upload continues with the files PyPI does not have yet.
          skip-existing: true

  crates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # crates.io accepts trusted publishing only after the first version exists, so 0.0.1 is
      # published by hand. A version that is already on crates.io is skipped, not an error.
      - name: Check whether this version is already on crates.io
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'kvrail release (hello@kvrail.org)' \
            "https://crates.io/api/v1/crates/kvrail/${GITHUB_REF_NAME#v}")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = 200 -o "$status" = 404
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.published.outputs.status == '404'
        id: auth
      - if: steps.published.outputs.status == '404'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
