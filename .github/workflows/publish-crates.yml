name: publish-crates
on:
  push:
    tags: ["rs-v*"]

permissions:
  contents: read

# crates.io accepts trusted publishing only after the first version exists. Publish 0.0.1 by
# hand with `cargo publish`, then link this workflow and the `release` environment on crates.io.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "rs-v$version" = "$GITHUB_REF_NAME"
      # Tests run on Linux too: the parsers are portable, only `doctor` itself needs macOS.
      - run: cargo test --locked
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
